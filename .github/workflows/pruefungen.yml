name: Code-Pruefungen

on:
  push:
    branches:
      - main
      - refactor/aufraeumen-deutsche-struktur
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript- und Python-Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: JavaScript-Dateien pruefen
        run: npm run check

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Syntax pruefen
        run: python -m py_compile main.py
